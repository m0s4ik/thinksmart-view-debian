# Same MAC address during scans too, so the router always sees one client (the fixed MAC, if any, is in the
# Wi-Fi profile: cloned-mac-address).
[device]
wifi.scan-rand-mac-address=no

[connection]
# Wi-Fi power saving off (2 = disable): lower latency (voice, streaming)
wifi.powersave=2
