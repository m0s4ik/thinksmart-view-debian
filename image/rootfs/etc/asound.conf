# /etc/asound.conf (ThinkSmart View, card 0 = cd-18781y).
# Playback goes through "speaker" = softvol in front of plughw:0,0, with its own control "Master Playback Volume"
# (simple control "Master", -40…0 dB, 1 dB per step). The speaker volume is the amplifier ('Speaker Amp Master', see
# driver/tas5782m/README.md) and thinksmart-audio leaves "Master" at 100%: applications may lower it for their own
# use. With an old driver without hardware volume it is the volume (thinksmart-audio, VOLUME_CONTROL=softvol).
# The control appears on card 0 the first time the pcm is opened: thinksmart-audio triggers it at boot.
# "default" plays on "speaker" and records from the two digital microphones (plughw:0,1), so ordinary programs
# (aplay, arecord, Python libraries) work without options.
# Note: dmix does not work on this card (see docs/known-issues.md): one player at a time.
pcm.speaker {
    type softvol
    slave.pcm "plughw:0,0"
    control {
        name "Master Playback Volume"
        card 0
    }
    min_dB -40.0
    max_dB 0.0
    resolution 41
}

pcm.!default {
    type asym
    playback.pcm "speaker"
    capture.pcm "plughw:0,1"
}

ctl.!default {
    type hw
    card 0
}
