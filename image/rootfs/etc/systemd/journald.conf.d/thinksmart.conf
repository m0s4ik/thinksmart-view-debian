# Journal on disk (/var/log/journal), at most 50 MB: the history survives reboots, which is what you need to debug
# Wi-Fi drops or audio problems after the fact. The base system writes about one line a minute, so 50 MB is weeks.
# For RAM only (less eMMC wear): Storage=volatile.
[Journal]
Storage=persistent
SystemMaxUse=50M
RuntimeMaxUse=50M
